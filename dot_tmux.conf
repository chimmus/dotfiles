# Mouse for when I'm Lazy
set -g mouse on
# set -g window-status-current-style fg=green,bg=default,bold

# Change the index so its more ergonomic 
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# They tell me this is a good edition to the config so why not?
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# set-option -g window-status-format " #I:#{?#{==:#W,zsh},#(whoami),#W} "
# set-option -g window-status-current-format " #I:#{?#{==:#W,zsh},#(whoami),#W} "
set -g status-style "fg=white,bg=default"
# set -g status 2
# set -g 'status-format[1]' '#[bg=default]'

# Time
set-option -g status-right "#[fg=black,bg=blue,bold] %a %d %b %I:%M %p "
# Session Number
set-option -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "

set-option -g window-status-current-format "#[fg=black,bg=blue,bold] #I "
#[fg=black,bg=blue,bold]#{?#{==:#W,zsh},#(whoami),#W} "
set-option -g window-status-format "#[fg=white,bg=brightblack] #I "
#[fg=white,bg=default]#{?#{==:#W,zsh},#(whoami),#W} "

set-option -g window-status-current-style "default"
set-option -g window-status-style "default"

set-option -u -g message-style

set-option -g status-position top

set -g mode-style "bg=#3f5572,fg=default"
set -g message-style "fg=black,bg=blue,fill=blue,bold"
set -g pane-active-border-style fg=blue
# set-option -g status-position bottom

# Remove these if you enable bottom
# set -g status 3
# set -Fg 'status-format[1]' '#{status-format[0]}'
# set -g 'status-format[2]' ''
# set -g 'status-format[0]' ''

set -g allow-passthrough on
set -g set-clipboard on
set -as terminal-features ",xterm*:RGB"
set -as terminal-features ",xterm*:clipboard"
